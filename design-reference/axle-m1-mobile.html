<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axle M1 mobile</title>
<style>
/* Axle M1 mobile: hi-fi clickable phone mock. Built on the locked tokens (box-code/assets/tokens.css),
   primitives follow box-code/assets/components.css. Light theme only. */
:root {
  /* -- neutrals (Polaris cool grey) -- */
  --bg: #f1f1f1;            /* page background */
  --surface: #ffffff;       /* cards, table rows */
  --surface-2: #fafafa;     /* table heads, subtle fills, hover/selected */
  --ink: #303030;           /* primary text */
  --ink-2: #616161;         /* secondary text */
  --muted: #616161;         /* muted text */
  --faint: #8a8a8a;         /* placeholders, disabled */
  --border: #e3e3e3;        /* hairlines (cards, rows) */
  --border-2: #d4d4d4;      /* control borders (kept a touch stronger for affordance) */
  --border-sub: #ebebeb;    /* subtle inner dividers (card heads, separators) */

  /* -- brand: near-black (Shopify primary buttons) -- */
  --brand: #303030;
  --brand-hover: #1a1a1a;   /* hover / active */

  /* -- accent: deep green: ACCENT ONLY (brand mark + success). Never a primary button. -- */
  --accent: #008060;
  --accent-strong: #006e52; /* accent hover / active */
  --accent-soft: #e3f9ec;   /* soft success fills */
  --accent-ring: #005bd3;   /* focus ring: Polaris focus indicator (high contrast everywhere) */

  /* -- status hues (chips, banners): Polaris badge tones -- */
  --ok-bg: #e3f9ec;    --ok-fg: #0c5132;    /* ready / success */
  --warn-bg: #ffeaba;  --warn-fg: #5a4200;  /* needs answer / attention */
  --info-bg: #e1eeff;  --info-fg: #00405e;  /* investigating / info */
  --new-bg: #ededed;   --new-fg: #616161;   /* new / neutral */
  --off-bg: #f1f1f1;   --off-fg: #616161;   /* done / archived (AA-legible) */
  --bad-bg: #ffe9e8;   --bad-fg: #8e1f0b;   /* injection / critical */
  --mark: #ffe066;                          /* search hits */

  /* -- spacing (8px grid) -- */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;

  /* -- type (Polaris system stack, 13px/20px body) -- */
  --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --fs-xs: 12px; --fs-sm: 12px; --fs-base: 13px; --fs-md: 15px; --fs-lg: 17px; --fs-xl: 20px;
  --lh: 1.54;   /* 13px body -> ~20px line */

  /* -- shape (Polaris radii) -- */
  --r-ctl: 8px;    /* buttons, inputs */
  --r-card: 12px;  /* cards, modals */
  --r-chip: 8px;   /* badges: Polaris rounded rect, not a full pill */

  /* -- elevation (calm: a hairline + a faint card lift; floating layers lift more) -- */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .04); /* subtle Polaris card shadow */
  --shadow-pop: 0 4px 16px rgba(0, 0, 0, .10);
  --shadow-modal: 0 10px 40px rgba(0, 0, 0, .3);
  --shadow-bar: 0 -2px 10px rgba(0, 0, 0, .06);
}
/* M1 phone additions (mock only, not in tokens.css): tap size, tap spacing, iOS no-zoom input size, scrim, bar height */
:root { --tap: 44px; --gap-tap: 8px; --fs-input: 16px; --scrim: rgba(48, 48, 48, .5); --bar-h: 48px; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: var(--fs-base); line-height: var(--lh); color: var(--ink); background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
.muted { color: var(--muted); }
.hint { font-size: var(--fs-sm); margin: var(--s1) 0 0; }
.m0 { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
.ic { width: 20px; height: 20px; flex: none; display: block; }
.ic.sm { width: 16px; height: 16px; }
.ic.xs { width: 12px; height: 12px; }
.grow1 { flex: 1 1 auto; min-width: 0; }

/* ---------- controls (every target >= --tap, >= --gap-tap apart) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--tap); min-width: var(--tap); padding: 0 var(--s4); border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font-size: var(--fs-base); font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn.block { display: flex; width: 100%; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { color: var(--faint); background: var(--surface-2); }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); flex: none; border-radius: var(--r-ctl); color: var(--ink); }
.iconbtn.outline { border: 1px solid var(--border-2); background: var(--surface); }
.iconbtn.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.iconbtn:disabled { color: var(--faint); }
.inp { display: block; width: 100%; min-height: var(--tap); padding: 10px var(--s3); font-size: var(--fs-input); line-height: 1.4; border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); }
.inp::placeholder, .ta::placeholder { color: var(--faint); }
.ta { display: block; width: 100%; min-height: 88px; padding: 10px var(--s3); font-size: var(--fs-input); line-height: 1.5; border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); resize: none; overflow: hidden; }
.ta.fb { min-height: 72px; }
.inp:focus, .ta:focus, .ta.focused { outline: 2px solid var(--accent-ring); outline-offset: 1px; border-color: var(--accent-ring); }
.flabel2 { display: block; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 700; margin: var(--s3) 0 var(--s1); }
.fldhint { margin: 0 0 var(--s2); }
.rowbtns { display: flex; flex-wrap: wrap; gap: var(--gap-tap); margin-top: var(--s2); }
.seg { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: 0 var(--s2); border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink-2); font-size: var(--fs-base); text-align: center; }
.seg.on { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.segrow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--gap-tap); }

/* ---------- chips / badges (as components.css) ---------- */
.chip { display: inline-block; padding: 2px 10px; border-radius: var(--r-chip); font-size: var(--fs-xs); font-weight: 600; background: var(--new-bg); color: var(--new-fg); white-space: nowrap; }
.chip.s-ready { background: var(--ok-bg); color: var(--ok-fg); }
.chip.s-awaiting_input { background: var(--warn-bg); color: var(--warn-fg); }
.chip.s-investigating { background: var(--info-bg); color: var(--info-fg); animation: ax-pulse 1.6s ease-in-out infinite; }
.chip.s-new { background: var(--new-bg); color: var(--new-fg); }
.chip.s-done { background: var(--off-bg); color: var(--off-fg); }
.chip.origin { background: var(--info-bg); color: var(--info-fg); }
.chip.prio1 { background: var(--bad-bg); color: var(--bad-fg); }
.chip.ctl { background: var(--surface); color: var(--ink); border: 1px solid var(--border-2); }
.chip .caret { font-size: var(--fs-xs); margin-left: var(--s1); }
.badge { display: inline-flex; align-items: center; gap: 2px; padding: 1px var(--s2); border-radius: var(--r-chip); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; }
.badge.edited { background: var(--warn-bg); color: var(--warn-fg); }
.badge.prio1 { background: var(--bad-bg); color: var(--bad-fg); }
.badge.att { background: var(--info-bg); color: var(--info-fg); }
.hbadge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--surface); font-size: var(--fs-xs); font-weight: 700; line-height: 18px; text-align: center; }
.st-ok, .st-warn { font-size: var(--fs-xs); font-weight: 600; padding: 2px var(--s2); border-radius: var(--r-chip); white-space: nowrap; }
.st-ok { background: var(--ok-bg); color: var(--ok-fg); }
.st-warn { background: var(--warn-bg); color: var(--warn-fg); }

/* ---------- motion ---------- */
@keyframes ax-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes ax-spin { to { transform: rotate(360deg); } }
@keyframes ax-shimmer { to { background-position-x: -200%; } }
@keyframes ax-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ax-fade { from { opacity: 0; } to { opacity: 1; } }
.spin { display: inline-block; flex: none; width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: ax-spin .8s linear infinite; }
.sk { display: block; height: 12px; border-radius: var(--r-chip); background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: ax-shimmer 1.2s linear infinite; }
@media (prefers-reduced-motion: reduce) { .sk, .spin, .chip.s-investigating, .sheet, .scrim, .cmp { animation: none !important; } }

/* ---------- phone shell ---------- */
.phone { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.scr { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.scroll { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.appbar { flex: none; display: flex; align-items: center; gap: var(--s1); height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) var(--s1) 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { flex: 1 1 auto; display: inline-flex; align-items: center; gap: var(--s2); padding-left: var(--s3); font-weight: 700; font-size: var(--fs-lg); color: var(--ink); }
.brand::before { content: ""; width: 16px; height: 16px; border-radius: calc(var(--r-ctl) / 2); background: var(--accent); flex: none; }
.ab-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-title.pl { padding-left: var(--s3); }

/* ---------- queue ---------- */
.qhead { flex: none; display: flex; flex-direction: column; gap: var(--gap-tap); padding: var(--s2) var(--s4) var(--s1); background: var(--surface); border-bottom: 1px solid var(--border); }
.qrow { display: flex; gap: var(--gap-tap); }
.qtabs { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap-tap); }
.qtab { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: 2px; line-height: 1.25; border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink-2); font-size: var(--fs-xs); }
.qtab .ql { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qtab .n { font-weight: 700; color: var(--ink); }
.qtab.on { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.qtab.on .n { color: var(--surface); }
.qsearch { display: flex; gap: var(--gap-tap); }
.qsearch .inp { flex: 1 1 auto; min-width: 0; }
.qlive { display: flex; align-items: center; gap: var(--s2); min-height: var(--tap); font-size: var(--fs-xs); color: var(--muted); }
.qlive .btn { font-size: var(--fs-base); padding: 0 var(--s3); }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.qlist { display: flex; flex-direction: column; gap: var(--gap-tap); padding: var(--s3) var(--s4) calc(56px + var(--s6) + env(safe-area-inset-bottom, 0px)); }
.qcard { display: block; width: 100%; min-height: 72px; padding: 10px var(--s3); text-align: left; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
.qcard > span { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.q-from { font-weight: 600; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.q-time { font-size: var(--fs-xs); white-space: nowrap; flex: none; }
.q-subj { font-size: var(--fs-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.q-badges { display: inline-flex; gap: var(--s1); flex: none; }
.qcard > span.q-l3 { margin-top: var(--s1); align-items: center; }
.q-sum { font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.q-l3 .chip { flex: none; }
.qcard.skel { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); }
.qempty { text-align: center; padding: var(--s6) var(--s4); }
.qempty p { margin: 0 0 var(--s3); font-size: var(--fs-md); }
.center { text-align: center; }
.fab { position: absolute; z-index: 5; right: var(--s4); bottom: calc(var(--s4) + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: var(--s2); height: 56px; padding: 0 20px 0 var(--s4); border-radius: var(--s4); background: var(--brand); color: var(--surface); font-size: var(--fs-md); font-weight: 600; box-shadow: var(--shadow-pop); }

/* ---------- item ---------- */
.chiprow { display: flex; gap: var(--gap-tap); overflow-x: auto; padding: 6px var(--s4) 0; /* 6px keeps the chip hit areas >= --gap-tap below the app-bar buttons */ background: var(--surface); border-bottom: 1px solid var(--border); scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chipcell { flex: none; display: inline-flex; align-items: center; min-height: var(--tap); min-width: var(--tap); }
.chipcell .chip { display: inline-flex; align-items: center; height: 32px; padding: 0 10px; }
.chipcell .sk { width: 96px; height: 32px; }
.pad { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s3) var(--s4) var(--s5); }
.cdbtn { justify-content: space-between; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--s3) var(--s4); box-shadow: var(--shadow-card); }
.box h3 { margin: 0; font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); font-weight: 700; }
.box h3 .h3n { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); }
.boxhead { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2); min-height: 20px; margin-bottom: var(--s2); }
.boxhead .spacer { flex: 1 1 auto; }
.saved { font-size: var(--fs-xs); color: var(--muted); }
ol.qs { margin: 0; padding-left: 20px; font-size: var(--fs-md); line-height: 1.45; }
.note { display: flex; align-items: center; gap: var(--s2); padding-left: var(--s3); margin-bottom: var(--s2); border-radius: var(--r-ctl); background: var(--info-bg); color: var(--info-fg); font-size: var(--fs-base); font-weight: 600; }
.note span { flex: 1 1 auto; }
.note .iconbtn { color: var(--info-fg); }
.trbox { margin-top: var(--s3); padding: 10px var(--s3); border-radius: var(--r-ctl); background: var(--info-bg); border-left: 3px solid var(--info-fg); }
.trbox h4 { margin: 0 0 var(--s1); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--info-fg); }
.trbox pre.mail { color: var(--info-fg); }
.msg { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--s3); background: var(--surface); }
.msg-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); font-size: var(--fs-sm); margin-bottom: var(--s2); }
pre.mail { margin: 0; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; font-family: inherit; font-size: var(--fs-md); line-height: 1.5; }
pre.mail.fade { -webkit-mask-image: linear-gradient(180deg, var(--ink) 75%, transparent); mask-image: linear-gradient(180deg, var(--ink) 75%, transparent); }
.foldrow { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); width: 100%; min-height: var(--tap); margin-top: var(--gap-tap); padding: 0 var(--s3); border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-base); font-weight: 600; text-align: left; }
.foldrow.card { margin-top: 0; padding: 0 var(--s4); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
.quoted { background: var(--surface-2); }
.quoted pre.mail { color: var(--ink-2); font-size: var(--fs-base); }
.attchips { display: flex; flex-wrap: wrap; gap: var(--gap-tap); margin-top: var(--s3); }
.attchip { display: inline-flex; align-items: center; gap: var(--s2); max-width: 100%; min-height: var(--tap); padding: 0 var(--s3); border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink); font-size: var(--fs-sm); font-weight: 600; }
.attchip > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attchip.out { padding-right: 0; }
.cf { margin-bottom: var(--s3); padding: var(--s3); border-radius: var(--r-ctl); background: var(--surface-2); border: 1px solid var(--border-sub); }
.cf-lbl { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 700; }
.cf-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s2); margin: var(--s1) 0; font-size: var(--fs-md); }
.cf-q { margin: 0 0 var(--s3); font-size: var(--fs-md); }
.banner { display: flex; align-items: center; gap: var(--s2); padding: 10px 14px; border-radius: var(--r-ctl); background: var(--info-bg); color: var(--info-fg); font-weight: 600; }
.skbox { display: flex; flex-direction: column; gap: 10px; }

/* ---------- item bottom bar (thumb zone) ---------- */
.ibar { flex: none; z-index: 4; display: flex; flex-direction: column; gap: var(--gap-tap); padding: var(--s2) var(--s4) calc(var(--s2) + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--border-2); box-shadow: var(--shadow-bar); }
.phone.kb .ibar { padding-bottom: var(--s2); }
.recip { display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: var(--tap); padding: 6px var(--s3); border: 1px solid var(--border-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font-size: var(--fs-base); text-align: left; }
.recip .to { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.recip .src { flex: none; font-size: var(--fs-xs); color: var(--muted); padding: 1px 6px; border-radius: var(--r-chip); background: var(--surface-2); border: 1px solid var(--border-sub); }
.recip.need { background: var(--warn-bg); border-color: var(--warn-fg); color: var(--warn-fg); font-weight: 600; }
.recip:disabled { color: var(--faint); }
.ibar-row { display: flex; gap: var(--gap-tap); }
.send { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); border: 1px solid var(--accent); border-radius: var(--r-ctl); background: var(--accent); color: var(--surface); font-size: var(--fs-md); font-weight: 600; }
.send:disabled { background: var(--new-bg); border-color: var(--border-2); color: var(--faint); }

/* ---------- drawn keyboard (no images) ---------- */
.kbd { flex: none; height: 291px; padding: var(--s2) 3px 0; background: var(--border-2); display: flex; flex-direction: column; gap: var(--s3); }
.krow { display: flex; gap: 6px; height: 42px; }
.krow.r2 { padding: 0 18px; }
.k { flex: 1 1 0; display: flex; align-items: center; justify-content: center; border-radius: calc(var(--r-ctl) - 3px); background: var(--surface); box-shadow: 0 1px 0 var(--faint); font-size: var(--fs-xl); color: var(--ink); }
.k.fn { background: var(--faint); color: var(--surface); font-size: var(--fs-base); }
.k.w15 { flex-grow: 1.4; } .k.w25 { flex-grow: 2.4; } .k.sp { flex-grow: 5; font-size: var(--fs-base); }

/* ---------- bottom sheet primitive ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); animation: ax-fade .15s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; max-height: calc(100% - var(--bar-h) - env(safe-area-inset-top, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-radius: var(--r-card) var(--r-card) 0 0; box-shadow: var(--shadow-modal); animation: ax-up .2s ease; }
.sheet.full { top: calc(env(safe-area-inset-top, 0px) + var(--s2)); max-height: none; background: var(--bg); }
.grab { flex: none; width: 36px; height: 5px; margin: var(--s2) auto 0; border-radius: 3px; background: var(--border-2); }
.sheet-head { flex: none; display: flex; align-items: center; gap: var(--s2); min-height: 52px; padding: 0 var(--s2) 0 var(--s4); border-bottom: 1px solid var(--border-sub); }
.sheet-head h2 { flex: 1 1 auto; margin: 0; font-size: var(--fs-lg); }

    if (b === 'reply' || b === 'subject') {
      it.edited = true;
      var ed = this.scr.querySelector('.edslot'); if (ed && !ed.firstChild) ed.innerHTML = '<span class="badge edited">edited</span>';
    }
    var sv = this.scr.querySelector('.savedslot');
    if (sv) {
      sv.textContent = 'Saving…'; clearTimeout(this._sv);
      this._sv = setTimeout(function () { it.saved = nowLabel(); sv.textContent = 'Saved ' + it.saved; }, 700);
    }
  };
  P.onChange = function (e) {
    var t = e.target;
    if (t.hasAttribute('data-rcp')) { this.item().pick = t.value; return; }
    if (t.tagName === 'SELECT' && t.getAttribute('data-bind')) { this.onInput(e); return; }
    var f = t.getAttribute('data-files');
    if (!f) return;
    var arr = [].slice.call(t.files || []).map(function (x) { return { name: x.name, size: fmtSize(x.size) }; });
    if (f === 'out') { var it = this.item(); it.out = it.out.concat(arr); this.render(); }
    else { this.d.c.files = this.d.c.files.concat(arr); var box = this.ml.querySelector('.cmpatts'); if (box) box.innerHTML = this.cmpAttsHTML(); }
    t.value = '';
  };
  P.onFocus = function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-bind') === 'other') {
      var it = this.item(); it.pick = 'other';
      var r = this.sl.querySelector('input[data-rcp][value="other"]'); if (r) r.checked = true;
    }
  };

  /* ================= boot: one full-screen phone (<= 500px) or a gallery of frames ================= */
  var mq = window.matchMedia('(max-width: 500px)');
  var PH = null, phones = [], vvFit = null;
  var SIZES = [[375, 812], [393, 852], [430, 932]];

  function boot() {
    var app = document.getElementById('app'), narrow = mq.matches;
    document.documentElement.className = narrow ? 'm-narrow' : 'm-wide';
    document.body.className = narrow ? 'm-narrow' : 'm-wide';
    app.innerHTML = ''; PH = null; phones = [];
    if (vvFit && window.visualViewport) { window.visualViewport.removeEventListener('resize', vvFit); vvFit = null; }
    var tok = location.hash.slice(1);
    if (narrow) {
      var el = document.createElement('div'); el.className = 'full'; app.appendChild(el);
      PH = new Phone(el, ROUTE[tok] ? tok : 'queue', true);
      if (window.visualViewport) {
        vvFit = function () { el.style.height = window.visualViewport.height + 'px'; window.scrollTo(0, 0); };
        window.visualViewport.addEventListener('resize', vvFit);
      }
      var pill = document.createElement('button'); pill.type = 'button'; pill.className = 'fpill'; pill.textContent = 'Frames';
      pill.setAttribute('aria-haspopup', 'dialog');
      var list = document.createElement('div'); list.className = 'flist'; list.hidden = true;
      list.innerHTML = '<div class="flpanel" role="dialog" aria-modal="true" aria-label="Frames"><div class="grab" aria-hidden="true"></div><div class="sheet-head"><h2>Frames</h2><button type="button" class="iconbtn" data-fl="close" aria-label="Close">' + I.x + '</button></div>' +
        '<div class="sheet-body">' + ROUTES.map(function (r) { return '<button type="button" class="srow" data-tok="' + r[0] + '"><span class="grow1"><b>#' + r[0] + '</b> <span class="muted">' + esc(r[1]) + '</span></span></button>'; }).join('') + '</div></div>';
      pill.addEventListener('click', function () { list.hidden = false; pill.hidden = true; });
      list.addEventListener('click', function (e) {
        var b = e.target.closest('[data-tok]');
        if (b) {
          var t = b.getAttribute('data-tok');
          if (location.hash.slice(1) === t) PH.setToken(t, false); else location.hash = t;
        }
        if (b || e.target === list || e.target.closest('[data-fl="close"]')) { list.hidden = true; pill.hidden = false; }
      });
      app.appendChild(pill); app.appendChild(list);
    } else {
      app.innerHTML = '<div class="gal"><header class="gal-head"><h1>Axle M1 mobile</h1>' +
        '<p>Hi-fi clickable phone mock of the agreed design (24 Sep 2026). Every frame is a live phone: tap through it, open sheets, type in the editor. Open this page on a phone (500px wide or less) to get one screen full-screen with a Frames list.</p>' +
        '<div class="gal-w" role="group" aria-label="Frame size"><span class="muted">Frame size</span>' + SIZES.map(function (s) { return seg('size', s.join('x'), s[0] + ' x ' + s[1], s[0] === 393); }).join('') + '</div></header><div class="grid"></div></div>';
      var grid = app.querySelector('.grid');
      ROUTES.forEach(function (r) {
        var fig = document.createElement('figure'); fig.className = 'frame'; fig.id = 'f-' + r[0];
        fig.innerHTML = '<figcaption><b>#' + r[0] + '</b> · ' + esc(r[1]) + '</figcaption>';
        var ph = document.createElement('div'); fig.appendChild(ph); grid.appendChild(fig);
        phones.push(new Phone(ph, r[0], false));
      });
      app.querySelector('.gal-w').addEventListener('click', function (e) {
        var b = e.target.closest('[data-act="size"]'); if (!b) return;
        var wh = b.getAttribute('data-arg').split('x');
        grid.style.setProperty('--pw', wh[0] + 'px'); grid.style.setProperty('--ph', wh[1] + 'px');
        var all = this.querySelectorAll('.seg');
        for (var i = 0; i < all.length; i++) { var on = all[i] === b; all[i].classList.toggle('on', on); all[i].setAttribute('aria-pressed', on); }
        phones.forEach(function (p) { p.render('none'); });
      });
      if (ROUTE[tok]) { var f = document.getElementById('f-' + tok); if (f) f.scrollIntoView(); }
    }
  }
  function onRoute() {
    var tok = location.hash.slice(1);
    if (!ROUTE[tok]) return;
    if (PH) { if (tok !== tokenFor(PH.v)) { PH.v.sheet = null; PH.v.modal = null; PH.setToken(tok, false); } }
    else { var f = document.getElementById('f-' + tok); if (f) f.scrollIntoView({ behavior: 'smooth' }); }
  }
  window.addEventListener('popstate', onRoute);
  window.addEventListener('hashchange', onRoute);
  if (mq.addEventListener) mq.addEventListener('change', boot); else if (mq.addListener) mq.addListener(boot);
  boot();
})();
</script>
</body>
</html>
